# The release workflow: a pushed tag becomes a published release, but only after the DRAFT of that
# release has been downloaded back and verified the way a user would download it.
#
#   job `package` (read-only token):  tag gate -> build and package -> keep the four assets as an artifact
#   job `release` (write token):      create a DRAFT with them -> verify the draft through the API -> check
#                                     that the draft still holds the verified asset ids -> publish by the
#                                     release id the verifier returned -> check the live asset ids again
#                                     -> fetch releases/latest like a user and compare it with the
#                                     verified archive.
#
# Why two jobs: everything that RUNS BUILD CODE (dotnet restore and publish execute NuGet packages and
# MSBuild targets) has only a read-only token. The job that holds `contents: write` runs no dotnet and
# no build: it only checks out the repository at the tagged commit (for the verifier scripts), takes the
# four files from the artifact and talks to the releases API. If `package` fails, `release` is skipped
# and creates nothing, not even a draft.
#
# Load-bearing choices (do not "simplify" them away):
#   * `tags: ['**']`: a tag of any name starts the run, so a malformed tag (V1.9.0, v1.9, v1.9.0-rc)
#     fails at the tag gate with the retag commands instead of being silently ignored by a filter.
#   * A DRAFT first: a failed verification leaves a draft, so releases/latest never moves.
#   * Publishing is by the verifier's release id, never by tag name: a stale draft with the same tag
#     can then never be the one that goes live (the verifier refuses two releases for one tag). The
#     asset ids are compared again just before and just after the publish call, so an asset that was
#     added, replaced or removed after the verification stops the release instead of going live.
#   * The fixed asset name teststand-mcp.zip is what users fetch from releases/latest/download/.
#   * Tag names, inputs and refs are user input: they reach `run:` only through env, never inline.
#   * Tag pushes share ONE queue (`release-publish`), so two tags can never publish at the same time
#     and `releases/latest` ends up at the tag that was pushed last. GitHub keeps one RUNNING and one
#     PENDING run per queue: a third tag pushed while two are waiting replaces the pending one, so
#     push release tags one at a time.
#
# What the verification does NOT prove: that the build is genuine. It proves that the uploaded files
# are intact (digest, manifest, versioned copy) and were uploaded with this repository's workflow
# token. A compromised build step would produce a consistent, verified, malicious release. Build
# provenance attestation is a follow-up and is deliberately not part of this workflow yet.
#
# A manual run is a DRY RUN: it packages, creates a draft under the rehearsal tag
# v<X.Y.Z>-rehearsal, verifies it through the API, then deletes the draft and its tag. It never
# publishes. `inject_fault: corrupt-zip` replaces the uploaded zip with corrupt bytes: the run must
# fail at the verification, publish nothing, and still clean up. This is also how the fork
# rehearsal exercises the whole path before the first real tag.
name: release

on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Rehearsal tag, v<X.Y.Z>-rehearsal (the draft is created under it and deleted again)'
        required: true
        type: string
      dry_run:
        description: 'Dry run: package, create the draft, verify it, delete it. A release is cut by pushing a tag, so this must stay ticked.'
        required: true
        type: boolean
        default: true
      inject_fault:
        description: 'Fault to inject after the upload, to prove that a bad draft is never published'
        required: true
        type: choice
        options:
          - none
          - corrupt-zip
        default: none

# Nothing by default; every job states what it needs.
permissions: {}

# All tag pushes wait in one queue; a running release is never cancelled half-way. A dry run queues per ref.
concurrency:
  group: release-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  EVENT_NAME: ${{ github.event_name }}
  # 'true' only for a manual run that asked for it. A pushed tag is never a rehearsal, whatever its name.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
  INJECT_FAULT: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_fault || 'none' }}
  # User input: the pushed ref name, or the rehearsal tag of a manual run. Only the gate trusts it.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  OUT_DIR: artifacts/release
  # Outside OUT_DIR, so it is never uploaded as a release asset.
  OWN_DOWNLOADS_FILE: artifacts/own-downloads.json

defaults:
  run:
    shell: powershell   # Windows PowerShell 5.1, the host the maintainers package with

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      rehearsal: ${{ steps.gate.outputs.rehearsal }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a manual run that is not a dry run
        if: env.EVENT_NAME == 'workflow_dispatch' && env.DRY_RUN != 'true'
        run: |
          Write-Host '::error::A release is cut by pushing a tag vX.Y.Z. A manual run is only a dry run: tick dry_run.'
          exit 1

      - name: Check the tag (the gate)
        id: gate
        timeout-minutes: 5
        run: |
          $rehearsal = ($env:DRY_RUN -eq 'true')
          & .\build\Assert-ReleaseTag.ps1 -Tag $env:TAG -Rehearsal:$rehearsal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require a rehearsal tag for a dry run
        if: env.DRY_RUN == 'true' && steps.gate.outputs.rehearsal != 'true'
        run: |
          Write-Host '::error::A dry run needs a rehearsal tag v<X.Y.Z>-rehearsal, so that its draft and tag can never collide with a real release.'
          exit 1

      - name: Install .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Package the plugin archive
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_TAG: ${{ steps.gate.outputs.tag }}
        timeout-minutes: 30
        run: |
          & .\build\Build-PluginArchive.ps1 -Version $env:RELEASE_VERSION -Tag $env:RELEASE_TAG -OutDir $env:OUT_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The files are already compressed archives: store them as they are.
      - name: Keep the four assets for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ env.OUT_DIR }}/teststand-mcp*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write   # create, edit and delete releases, upload their assets, delete the rehearsal tag
    env:
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
    steps:
      # The repository at the tagged commit: only the verifier and gate scripts are used from it.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the four assets built by the package job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ env.OUT_DIR }}

      - name: Create the draft release with the four assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        timeout-minutes: 15
        run: |
          $assets = @(Get-ChildItem -LiteralPath $env:OUT_DIR -File | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 4) {
            Write-Host "::error::The package job left $($assets.Count) asset(s) in $env:OUT_DIR; a release has exactly four."
            exit 1
          }
          $notes = 'Built and verified by the release workflow. Install it through the Claude Code plugin marketplace.'
          if ($env:DRY_RUN -eq 'true') {
            # The rehearsal tag does not exist: the draft names it and points at this commit.
            gh release create $env:RELEASE_TAG @assets --repo $env:REPO --draft --title $env:RELEASE_TAG --notes $notes --target $env:TARGET_SHA
          } else {
            gh release create $env:RELEASE_TAG @assets --repo $env:REPO --draft --verify-tag --title $env:RELEASE_TAG --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Corrupt the uploaded zip (dry run only, to prove a bad draft is never published)
        if: env.DRY_RUN == 'true' && env.INJECT_FAULT == 'corrupt-zip'
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        run: |
          Import-Module .\build\ReleaseAssets.psm1 -Force
          $folder = Join-Path $env:RUNNER_TEMP 'corrupt-zip'
          [void](New-Item -ItemType Directory -Path $folder -Force)
          $corrupt = Join-Path $folder $ReleaseArchiveName
          [IO.File]::WriteAllBytes($corrupt, [byte[]](80, 75, 3, 4, 0, 0, 0, 0, 0, 0, 0, 0, 255, 254, 253))
          gh release upload $env:RELEASE_TAG $corrupt --clobber --repo $env:REPO
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the draft the way a user would download it
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 30
        run: |
          $rehearsal = ($env:DRY_RUN -eq 'true')
          & .\build\Assert-PublishedRelease.ps1 -Repo $env:REPO -Tag $env:RELEASE_TAG -Token $env:GH_TOKEN -OwnDownloadsPath $env:OWN_DOWNLOADS_FILE -Rehearsal:$rehearsal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check that the draft still holds exactly the verified assets
        id: recheck
        if: env.DRY_RUN != 'true' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.verify.outputs.release_id }}
          ASSET_IDS: ${{ steps.verify.outputs.asset_ids }}
        timeout-minutes: 5
        run: |
          if ($env:RELEASE_ID -notmatch '^[0-9]+$') {
            Write-Host '::error::The verification did not report the id of the release it verified, so there is nothing safe to publish.'
            exit 1
          }
          $body = (gh api "repos/$env:REPO/releases/$env:RELEASE_ID") -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\Assert-ReleaseAssetSet.ps1 -ReleaseJson $body -ExpectedAssetIds $env:ASSET_IDS -ReleaseId $env:RELEASE_ID -Stage BeforePublish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish the verified release as the latest release
        id: publish
        if: env.DRY_RUN != 'true' && steps.verify.outcome == 'success' && steps.recheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.verify.outputs.release_id }}
        timeout-minutes: 5
        run: |
          if ($env:RELEASE_ID -notmatch '^[0-9]+$') {
            Write-Host '::error::The verification did not report the id of the release it verified, so there is nothing safe to publish.'
            exit 1
          }
          $isDraft = gh api -X PATCH "repos/$env:REPO/releases/$env:RELEASE_ID" -F draft=false -f make_latest=true --jq '.draft'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($isDraft -ne 'false') {
            Write-Host "::error::Release $env:RELEASE_ID is still a draft after the publish call."
            exit 1
          }

      - name: Check that the published release holds exactly the verified assets
        id: recheck_after
        if: env.DRY_RUN != 'true' && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.verify.outputs.release_id }}
          ASSET_IDS: ${{ steps.verify.outputs.asset_ids }}
        timeout-minutes: 5
        run: |
          $body = (gh api "repos/$env:REPO/releases/$env:RELEASE_ID") -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\Assert-ReleaseAssetSet.ps1 -ReleaseJson $body -ExpectedAssetIds $env:ASSET_IDS -ReleaseId $env:RELEASE_ID -Stage AfterPublish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch releases/latest as users do and compare it with the verified archive
        id: latest
        if: env.DRY_RUN != 'true' && steps.publish.outcome == 'success' && steps.recheck_after.outcome == 'success'
        env:
          ARCHIVE_SHA256: ${{ steps.verify.outputs.archive_sha256 }}
        timeout-minutes: 15
        run: |
          & .\build\Assert-PublishedRelease.ps1 -Latest -Repo $env:REPO -ExpectedArchiveSha256 $env:ARCHIVE_SHA256 -OwnDownloadsPath $env:OWN_DOWNLOADS_FILE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Delete the rehearsal draft and its tag (dry run only)
        if: always() && env.DRY_RUN == 'true' && needs.package.outputs.rehearsal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 5
        run: |
          # Best effort: every call is checked below, and a failed run must still reach the end. A native
          # command that is ALLOWED to fail (the tag probe) must not be the last writer of $LASTEXITCODE,
          # because the runner ends the step with it: the block ends with an explicit exit.
          $ErrorActionPreference = 'Continue'
          $failed = $false
          # Only DRAFTS carrying the rehearsal tag; a published release is never touched.
          $ids = @(gh api --paginate "repos/$env:REPO/releases?per_page=100" --jq '.[] | select(.draft == true and .tag_name == $ENV.RELEASE_TAG) | .id')
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::Could not list the releases to find the rehearsal draft.'; exit 1 }
          foreach ($id in $ids) {
            if ($id -notmatch '^[0-9]+$') { continue }
            gh api -X DELETE "repos/$env:REPO/releases/$id"
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::Could not delete the rehearsal draft $id."; $failed = $true } else { Write-Host "Deleted the rehearsal draft $id." }
          }
          # A draft has no git tag yet; a tag only exists when something created it, and then it must go too.
          # Only a 404 means "absent"; any other failure is a failure.
          $probe = (gh api "repos/$env:REPO/git/ref/tags/$env:RELEASE_TAG" 2>&1 | Out-String)
          $probeExit = $LASTEXITCODE
          if ($probeExit -eq 0) {
            gh api -X DELETE "repos/$env:REPO/git/refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::Could not delete the rehearsal tag $env:RELEASE_TAG."; $failed = $true } else { Write-Host "Deleted the rehearsal tag $env:RELEASE_TAG." }
          } elseif ($probe -match 'HTTP 404') {
            Write-Host "No tag $env:RELEASE_TAG exists, so none is deleted."
          } else {
            Write-Host "::error::Could not check whether the rehearsal tag $env:RELEASE_TAG exists: $probe"
            $failed = $true
          }
          if ($failed) { exit 1 }
          exit 0

      # The stats collector reads this artifact (name, file name and schema are its contract). It is
      # uploaded even when the run failed: the downloads that happened still count.
      - name: Report this run's own downloads to the stats collector
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: own-downloads
          path: ${{ env.OWN_DOWNLOADS_FILE }}
          if-no-files-found: warn
